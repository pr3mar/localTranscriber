[project]
name = "localtranscriber"
version = "0.1.1"
description = "Local, Dockerised audio/video to .srt subtitles with optional translation"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
asr = ["faster-whisper", "nemo_toolkit[asr]"]

[project.scripts]
localtranscriber = "localtranscriber.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localtranscriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
